# ─────────────────────────────────────────────
# ABOUT PAGE
# ─────────────────────────────────────────────
about_bio: |
  I am an M.S. student in mechanical engineering at Carnegie Mellon University, where I research soft tactile sensors in the Soft Machines Lab (advisor: Prof. Carmel Majidi). My sensors pair an array of planar PCB coils with a magnetorheological elastomer (MRE). When the elastomer is pressed, the coils' inductance changes; I collect that data with a robotic arm and an INSTRON load frame, then train machine-learning models that locate the contact point.

  Before CMU, I earned a B.S. in mechanical engineering (Robotics and Mechatronics) from Virginia Tech. There I worked in the Soft Materials and Structures Lab (advisor: Prof. Michael D. Bartlett) on octopus-inspired switchable adhesives and 3D-printed flexible materials, and I designed the electrical system for my capstone team's 90° peel-test machine.

  Across these projects, I build complete systems: I design the hardware, write the code that drives the experiments, and validate performance with measured data. I want to bring that end-to-end approach to an R&D team building robots, haptic devices, or medical devices that must sense and respond to touch.
skills:
  - group: "Sensing & Robotics"
    items: ["Inductive tactile sensors", "Robotic-arm test automation", "INSTRON mechanical testing"]
  - group: "Machine Learning & Software"
    items: ["Python", "MATLAB", "Machine learning for sensor data"]
  - group: "Electronics & Embedded"
    items: ["Arduino", "STM32", "KiCad", "LTspice", "Motor control"]
  - group: "Design & Fabrication"
    items: ["SolidWorks", "3D printing (FDM, DLP, SLA)", "Mold casting", "Direct Ink Writing", "Laser processing"]

