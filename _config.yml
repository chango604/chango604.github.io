# ─────────────────────────────────────────────
# ABOUT PAGE
# ─────────────────────────────────────────────
about_bio: |
  I'm a mechanical engineering graduate researcher at Carnegie Mellon's Soft Machines Lab (advised by Prof. Carmel Majidi), where I design and characterize soft inductive tactile sensors that combine planar coil arrays with magnetorheological elastomer (MRE). My work spans hardware design, robotics-driven experimentation, and machine learning — I build the sensors, automate the data collection with a robotic arm and load-cell instrumentation, and train the models that turn raw signals into predictions of contact location and force.

  Before CMU, I worked in the Soft Materials and Structures Lab at Virginia Tech (advised by Prof. Michael D. Bartlett), where I fabricated and tested bio-inspired switchable adhesives and led the electrical design for a capstone testing machine. Across these projects, my consistent focus has been building complete systems — from physical fabrication through data analysis — that solve real sensing and material-characterization problems.

  I'm looking for opportunities in robotics, sensing hardware, or R&D engineering roles where I can keep building end-to-end systems: designing hardware, writing the code that drives it, and validating performance with real data. Outside the lab, I enjoy 3D printing, CAD modeling, and building creative sensor-driven interfaces.
skills:
  - Inductive & Tactile Sensing
  - Machine Learning for Sensor Data
  - Robotics & Experimental Automation
  - Materials Fabrication & Characterization
  - Python, MATLAB, Arduino

